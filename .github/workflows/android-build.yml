# Builds the Android robot app and runs its unit tests on every push that
# touches it. The debug APK is kept as a build artifact (Actions tab) and, for
# pushes to main, published to the apk-latest branch so a phone can download it
# without a GitHub account:
#   https://github.com/quangvu16/Ackermann_robot_openbot/raw/apk-latest/OpenBot-Ackermann-debug.apk
name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'robot/android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'robot/android/**'
  workflow_dispatch:

permissions:
  contents: write  # to publish the APK to the apk-latest branch

jobs:
  build:
    name: Build and unit-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robot/android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the app-versioning plugin reads git history and tags

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
          cache: gradle

      - name: Add the dummy google-services.json
        run: |
          cp ci/google-services.placeholder.json app/google-services.json
          cp ci/google-services.placeholder.json app/src/main/assets/google-services.json

      - name: Build and test
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :robot:assembleDebug :robot:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show compile and test errors as annotations
        if: failure()
        run: |
          grep -E "error:|^e: |FAILED|What went wrong|Exception" "$RUNNER_TEMP/build.log" \
            | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: robot-debug-apk
          path: robot/android/app/build/outputs/apk/debug/*.apk

      # One commit on an orphan branch, force-pushed each time, so the repo history
      # does not grow with every APK.
      - name: Publish the APK to the apk-latest branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          out="$RUNNER_TEMP/apk-latest"
          mkdir -p "$out"
          cp "$apk" "$out/OpenBot-Ackermann-debug.apk"
          cd "$out"
          {
            echo "# OpenBot Ackermann - latest debug APK"
            echo
            echo "Built from commit ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "Download on the phone:"
            echo "https://github.com/${GITHUB_REPOSITORY}/raw/apk-latest/OpenBot-Ackermann-debug.apk"
            echo
            echo "Signed with a debug key. Uninstall an OpenBot app signed with another key first."
          } > README.md
          git init -q -b apk-latest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OpenBot-Ackermann-debug.apk README.md
          git commit -q -m "Debug APK for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-latest
          echo "::notice::APK published: https://github.com/${GITHUB_REPOSITORY}/raw/apk-latest/OpenBot-Ackermann-debug.apk"
